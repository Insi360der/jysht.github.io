<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D模型陈浩祺</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #1a1a1a; }
        canvas { display: block; }

        /* 电脑默认大小 */
        .model-buttons {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            display: flex;
            gap: 12px;
        }
        .model-btn {
            padding: 12px 24px;
            font-size: 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .model-btn:hover { background: #2980b9; }
        .model-btn.active { background: #2ecc71; }

        /* 👇 手机端自动缩小（手机适用） */
        @media (max-width: 768px) {
            .model-buttons {
                gap: 6px;
            }
            .model-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }

        .loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 99998;
            color: white;
            font-size: 18px;
            background: rgba(0,0,0,0.7);
            padding: 15px 30px;
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .loading.show {
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="loading" id="loading">正在加载模型...</div>

    <script src="../global-menu.js"></script>

    <div class="model-buttons">
        <button class="model-btn active" data-model="../pages/hao (1).glb">模型 1</button>
        <button class="model-btn" data-model="../pages/hao (2).glb">模型 2</button>
        <button class="model-btn" data-model="../pages/hao (3).glb">模型 3</button>
        <button class="model-btn" data-model="../pages/hao (4).glb">模型 4</button>
    </div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
    </script>

    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x202020);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 10;

    const renderer = new THREE.WebGLRenderer({ 
        antialias: true,
        powerPreference: "high-performance"
    });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);
    
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(5, 10, 5);
    scene.add(dirLight);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 2;
    controls.maxDistance = 30;

    let currentModel = null;
    const loader = new GLTFLoader();
    const loadingElement = document.getElementById('loading');
    let isLoading = false;

    // ========== 【BUG 修复】彻底销毁模型，永不重叠 ==========
    function disposeModel(model) {
        if (!model) return;
        scene.remove(model);
        model.traverse(child => {
            if (child.material) {
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                mats.forEach(mat => {
                    for (let t in mat) {
                        if (mat[t] && mat[t].isTexture) mat[t].dispose();
                    }
                    mat.dispose();
                });
            }
            if (child.geometry) child.geometry.dispose();
        });
    }

    function loadModel(url) {
        if (isLoading) return;
        isLoading = true;
        loadingElement.classList.add('show');

        // 先销毁旧模型
        disposeModel(currentModel);
        currentModel = null;

        loader.load(url, (gltf) => {
            const model = gltf.scene;
            currentModel = model;

            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = maxDim > 0 ? 4 / maxDim : 1;

            model.scale.setScalar(scale);
            model.position.copy(center).multiplyScalar(-scale);

            scene.add(model);

            isLoading = false;
            loadingElement.classList.remove('show');
        }, undefined, (err) => {
            console.error(err);
            isLoading = false;
            loadingElement.classList.remove('show');
        });
    }

    const buttons = document.querySelectorAll('.model-btn');
    buttons.forEach(btn => {
        btn.addEventListener('click', () => {
            if (isLoading) return;
            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadModel(btn.dataset.model);
        });
    });

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    loadModel("../pages/hao (1).glb");
    animate();
    </script>
</body>
</html>
