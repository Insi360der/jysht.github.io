<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>3D模型查看器 - 4模型切换</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #1a1a1a; }
        canvas { display: block; }

        /* 按钮样式 —— 修复层级！*/
        .model-buttons {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999; /* 这里改大，确保在最上层 */
            display: flex;
            gap: 12px;
        }

        .model-btn {
            padding: 12px 24px;
            font-size: 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .model-btn:hover {
            background: #2980b9;
        }

        .model-btn.active {
            background: #2ecc71;
        }
    </style>
</head>
<body>

<!-- 4个模型切换按钮 -->
<div class="model-buttons">
    <button class="model-btn active" data-model="./3D.glb">模型 1</button>
    <button class="model-btn" data-model="./model2.glb">模型 2</button>
    <button class="model-btn" data-model="./model3.glb">模型 3</button>
    <button class="model-btn" data-model="./model4.glb">模型 4</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// 1. 创建场景
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x202020);

// 2. 创建相机
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 10;

// 3. 渲染器
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// 4. 灯光
const ambientLight = new THREE.AmbientLight(0xffffff, 1);
scene.add(ambientLight);
const dirLight = new THREE.DirectionalLight(0xffffff, 1);
dirLight.position.set(5, 10, 5);
scene.add(dirLight);

// 5. 鼠标控制
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

// 全局变量：当前加载的模型
let currentModel = null;
const loader = new GLTFLoader();

// 加载模型函数（可复用）
function loadModel(url) {
    // 先移除旧模型
    if (currentModel) {
        scene.remove(currentModel);
        currentModel.traverse(child => {
            if (child.material) child.material.dispose();
            if (child.geometry) child.geometry.dispose();
        });
        currentModel = null;
    }

    loader.load(
        url,
        (gltf) => {
            const model = gltf.scene;
            currentModel = model;

            // 自动居中 + 适配大小
            const box = new THREE.Box3().setFromObject(model);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 3 / maxDim;
            model.scale.setScalar(scale);
            model.position.sub(center.multiplyScalar(scale));

            scene.add(model);
            console.log("✅ 模型加载成功：", url);
        },
        (xhr) => {
            console.log(`加载中：${(xhr.loaded / xhr.total * 100).toFixed(0)}%`);
        },
        (err) => {
            console.error("❌ 模型加载失败：", err);
            alert(`加载失败！\n模型文件：${url}\n请检查文件是否存在`);
        }
    );
}

// 绑定按钮点击事件
const buttons = document.querySelectorAll('.model-btn');
buttons.forEach(btn => {
    btn.addEventListener('click', () => {
        // 按钮高亮
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        
        // 加载对应模型
        const modelUrl = btn.getAttribute('data-model');
        loadModel(modelUrl);
    });
});

// 默认加载第一个模型
loadModel("./3D.glb");

// 窗口自适应
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// 渲染循环
function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
